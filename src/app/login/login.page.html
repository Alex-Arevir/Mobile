<div class="hero">

  <div class="main-box">

    <div class="form-box">

      <!-- ================================= -->
      <!-- FONDO QUE CAMBIA ENTRE FORMULARIOS -->
      <!-- ================================= -->

      <div class="brand-header">
        <p class="eyebrow">Acceso</p>
        <h1>{{ isRegister ? 'Crear cuenta' : 'Iniciar sesión' }}</h1>
      </div>

      <!-- ================================= -->
      <!-- BOTONES LOGIN / REGISTER -->
      <!-- ================================= -->

      <div class="button-box" role="tablist" aria-label="Seleccionar modo de acceso">
        <button
          type="button"
          class="toggle-btn"
          [class.active]="!isRegister"
          (click)="login()">
          Iniciar sesión
        </button>

        <button
          type="button"
          class="toggle-btn"
          [class.active]="isRegister"
          (click)="register()">
          Registrarse
        </button>
      </div>


      <!-- ================================= -->
      <!-- APP BRAND -->
      <!-- ================================= -->

      <div class="app-badge" aria-label="Aplicación mobile">
        <span class="app-badge__dot"></span>
        QuickHR
      </div>


      <!-- ================================= -->
      <!-- FORMULARIO LOGIN -->
      <!-- ================================= -->

      <form
        class="input-group login-form"
        [class.hidden]="isRegister"
        (ngSubmit)="onLogin()">

        <label class="field-label" for="loginUsername">Usuario</label>
        <input
          id="loginUsername"
          type="text"
          class="input-field"
          placeholder="Tu usuario"
          [(ngModel)]="loginData.username"
          name="loginUsername"
          required
        />

        <label class="field-label" for="loginPassword">Contraseña</label>
        <input
          id="loginPassword"
          type="password"
          class="input-field"
          placeholder="Tu contraseña"
          [(ngModel)]="loginData.password"
          name="loginPassword"
          required
        />

        <button type="submit" class="submit-btn">Entrar</button>
      </form>


      <!-- ================================= -->
      <!-- FORMULARIO REGISTER -->
      <!-- ================================= -->

      <form
        class="input-group register-form"
        [class.active]="isRegister"
        (ngSubmit)="onRegister()">

        <label class="field-label" for="registerUsername">Usuario</label>
        <input
          id="registerUsername"
          type="text"
          class="input-field"
          placeholder="Elige un usuario"
          [(ngModel)]="registerData.username"
          name="registerUsername"
          required
        />

        <label class="field-label" for="registerEmail">Correo</label>
        <input
          id="registerEmail"
          type="email"
          class="input-field"
          placeholder="ejemplo@correo.com"
          [(ngModel)]="registerData.email"
          name="registerEmail"
          required
        />

        <label class="field-label" for="registerPassword">Contraseña</label>
        <input
          id="registerPassword"
          type="password"
          class="input-field"
          placeholder="Crea una contraseña"
          [(ngModel)]="registerData.password"
          name="registerPassword"
          required
        />

        <button type="submit" class="submit-btn">Registrarme</button>
      </form>

    </div>


    <!-- ================================= -->
    <!-- BORDES ANIMADOS -->
    <!-- ================================= -->

    <span class="sp sp-t"></span>
    <span class="sp sp-r"></span>
    <span class="sp sp-b"></span>
    <span class="sp sp-l"></span>

  </div>

</div>

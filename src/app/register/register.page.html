<ion-content [fullscreen]="true" class="register-page">
  <main class="register-wrapper">
    <section class="register-card">
      <div class="brand">
        <div class="brand-icon"></div>
        <span>QuickHR</span>
      </div>

      <div class="heading">
        <span class="eyebrow">Acceso</span>
        <h1>Crear cuenta</h1>
        <p>Registra a un nuevo usuario para acceder a la plataforma.</p>
      </div>

      <form #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)" novalidate>
        <div class="field">
          <label for="username">Usuario</label>
          <input
            id="username"
            name="username"
            type="text"
            [(ngModel)]="form.username"
            placeholder="Elige un nombre de usuario"
            required
            minlength="3"
            maxlength="50"
            autocomplete="username"
          />
        </div>

        <div class="field">
          <label for="email">Correo</label>
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="form.email"
            placeholder="nombre@correo.com"
            required
            email
            autocomplete="email"
          />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="form.password"
              (ngModelChange)="validatePasswords()"
              placeholder="Escribe tu contraseña"
              required
              minlength="8"
              autocomplete="new-password"
            />

            <button
              type="button"
              class="eye-button"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path [attr.d]="showPassword ? eyeOffPath : eyePath"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirmar contraseña</label>
          <div class="password-wrapper">
            <input
              id="confirmPassword"
              name="confirmPassword"
              [type]="showConfirmPassword ? 'text' : 'password'"
              [(ngModel)]="form.confirmPassword"
              (ngModelChange)="validatePasswords()"
              placeholder="Repite la contraseña"
              required
              autocomplete="new-password"
            />

            <button
              type="button"
              class="eye-button"
              (click)="toggleConfirmPassword()"
              [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path [attr.d]="showConfirmPassword ? eyeOffPath : eyePath"></path>
              </svg>
            </button>
          </div>

          <small class="error" *ngIf="passwordMismatch">
            Las contraseñas no coinciden.
          </small>
        </div>

        <label class="privacy">
          <input
            type="checkbox"
            name="privacyCheck"
            [(ngModel)]="form.privacyAccepted"
            required
          />
          <span>
            Acepto la <a href="#" (click)="$event.preventDefault()">política de privacidad</a>
            y entiendo que la información de mi cuenta se almacenará de forma segura.
          </span>
        </label>

        <div class="server-message error-box" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="server-message success-box" *ngIf="successMessage">
          {{ successMessage }}
        </div>

        <button
          class="submit-button"
          type="submit"
          [disabled]="loading || registerForm.invalid || passwordMismatch"
        >
          {{ loading ? 'Creando cuenta...' : 'Crear cuenta' }}
        </button>
      </form>

      <div class="signin">
        <span>¿Ya tienes una cuenta?</span>
        <button type="button" (click)="goToLogin()">Iniciar sesión</button>
      </div>
    </section>
  </main>
</ion-content>
